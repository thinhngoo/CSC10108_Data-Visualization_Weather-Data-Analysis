<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h3 class="sidebar-brand">Weather Analysis</h3>
    <button
      id="toggle-sidebar"
      class="sidebar-toggle"
      aria-label="Toggle sidebar"
    >
      <svg
        class="sidebar-toggle-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a
      href="/"
      class="sidebar-link {% if active_route == 'analysis' %}active{% endif %}"
      data-route="analysis"
    >
      <svg
        class="sidebar-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="20" x2="18" y2="10" />
        <line x1="12" y1="20" x2="12" y2="4" />
        <line x1="6" y1="20" x2="6" y2="14" />
      </svg>
      <span class="sidebar-link-text">Analysis</span>
    </a>
    <a
      href="/dataset/raw/"
      class="sidebar-link {% if active_route == 'dataset-raw' %}active{% endif %}"
      data-route="dataset-raw"
    >
      <svg
        class="sidebar-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <path d="M10 9H8" />
        <path d="M16 13H8" />
        <path d="M16 17H8" />
        <path d="M10 13H8" />
      </svg>
      <span class="sidebar-link-text">Raw</span>
    </a>
    <a
      href="/dataset/refined/"
      class="sidebar-link {% if active_route == 'dataset-refined' %}active{% endif %}"
      data-route="dataset-refined"
    >
      <svg
        class="sidebar-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"
        />
        <path d="m9 12 2 2 4-4" />
      </svg>
      <span class="sidebar-link-text">Refined</span>
    </a>
  </nav>
</aside>
<script>
  (function () {
    if (
      window.innerWidth >= 1024 &&
      localStorage.getItem("sidebar-collapsed") === "true"
    ) {
      document.getElementById("sidebar").classList.add("collapsed");
    }
  })();
</script>
